<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/hero/pic.png" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Title -->
    <title>Pet Care | Best Pet Health & Grooming Services</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Pet Care provides professional pet grooming, health care, training, and pet wellness services for dogs and cats."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="pet care, dog grooming, cat care, pet health, pet services, pet clinic, pet training"
    />

    <!-- Author -->
    <meta name="author" content="Pet Care" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Pet Care | Best Pet Services" />
    <meta
      property="og:description"
      content="Professional pet care services including grooming, health care, and training."
    />
    <meta property="og:image" content="/hero/pic.png" />
    <meta property="og:type" content="website" />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pet Care" />
    <meta
      name="twitter:description"
      content="Professional pet care services for your lovely pets."
    />
    <meta name="twitter:image" content="/hero/pic.png" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
